<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Bing Wallpaper</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        color: #eee;
        -webkit-touch-callout: none; /* iOS Safari */

        -webkit-user-select: none; /* Chrome/Safari/Opera */

        -khtml-user-select: none; /* Konqueror */

        -moz-user-select: none; /* Firefox */

        -ms-user-select: none; /* Internet Explorer/Edge */

        user-select: none; /* Non-prefixed version, currently

        not supported by any browser */
      }
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        width: 100%;
        height: 100%;
      }
      .header {
        width: 100%;
        height: 35px;
        -webkit-app-region: drag;
        position: absolute;
        top: 0;
        cursor: move;
        z-index: 1;
        text-shadow: 0 0 10px #333;
      }
      .title {
        display: inline-block;
        text-align: center;
        line-height: 35px;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
      }
      .header-btn{
        -webkit-app-region: no-drag;
        height: 35px;
        padding: 0 15px;
        display: inline-block;
        text-align: center;
        line-height: 35px;
        cursor: pointer;
        float: right;
        top: 0;
        z-index: 999;
      }
      .header-btn i{
        transition: all 1s ease;
      }
      .active i{
        transform: rotate(360deg);
        color: orange;
      }
      .header-btn:hover i{
        transform: rotate(360deg);
        color: orange;
        text-shadow: 0 0 10px;
      }
      #infoBtn:hover i{
        color: green;
      }
      #closeBtn:hover i{
        color: red;
      }
      #body{
        width: 100%;
        height: 100%;
        background: #333;
        z-index: 0;
        position: relative;
        transition: all 0.5s ease;
        overflow: hidden;
      }
      #body > div{
        width: 100%;
        height: 100%;
        text-align: center;
        font-size: 20px;
        position: absolute;
        top: 0;
        left: 0;
        background: #333;
      }
      .tips, .loading{
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #img{
        z-index: -1;
        overflow: hidden;
      }
      #img img{
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .imgBtn {
        position: absolute;
        top: 0;
        padding: 0 20px;
        height: 100%;
        display: flex;
        align-items: center;
        z-index: 10;
      }
      .imgBtn i {
        cursor: pointer;
        transition: all 0.5s ease;
        font-size: 25px;
        text-shadow: 0 0 10px;
      }
      .imgBtn i:hover {
        text-shadow: 0 0 10px orange;
        color: orange;
      }
      .leftBtn {
        left: 0;
      }
      .rightBtn{
        right: 0;
      }
      #imgMain {
        line-height: 0;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .toolBar {
        position: absolute;
        padding: 0 10px 6px;
        bottom: 0;
        right: 0;
        z-index: 15;
      }
      .toolBar > div {
        display: inline-block;
        line-height: 26px;
      }
      .toolBar i {
        cursor: pointer;
        padding: 0 10px;
        text-shadow: 0 0 10px #333;
        transition: all 0.5s ease;
      }
      .toolBar i:hover {
        text-shadow: 0 0 10px orange;
        color: orange;
      }
      #setting {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.45);
        display: none;
      }
      .setting-card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 520px;
        padding: 8px 24px 20px 24px;
        background: rgba(15,15,15,0.78);
        backdrop-filter: blur(20px);
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
      .setting-title {
        font-size: 18px;
        font-weight: bold;
        line-height: 50px;
        border-bottom: 1px solid rgba(255,255,255,0.12);
        margin-bottom: 6px;
      }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 300;
        transition: background 0.2s ease;
      }
      .setting-row:hover {
        background: rgba(255,255,255,0.06);
      }
      .setting-label {
        flex-shrink: 0;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255,255,255,0.25);
        border-radius: 22px;
        transition: all 0.3s ease;
      }
      .slider:before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        top: 3px;
        background: white;
        border-radius: 50%;
        transition: all 0.3s ease;
      }
      .switch input:checked + .slider {
        background: orange;
      }
      .switch input:checked + .slider:before {
        transform: translateX(18px);
      }
      #copyright{
        position: absolute;
        padding: 0 15px 6px;
        bottom: 0;
        left: 0;
        font-size: 12px;
        z-index: 15;
        line-height: 20px;
        text-shadow: 0 0 10px #000;
      }
      #imgDate{
        position: absolute;
        left: 0;
        bottom: 26px;
        padding: 0 15px;
        font-size: 12px;
        z-index: 15;
        line-height: 20px;
        text-shadow: 0 0 10px #000;
      }
      .choseFilePath{
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.25);
        color: #eee;
        border-radius: 6px;
        line-height: 28px;
        padding: 0 14px;
        cursor: pointer;
        font-size: 13px;
        flex-shrink: 0;
        transition: all 0.2s ease;
      }
      .choseFilePath:hover{
        background: rgba(255,255,255,0.2);
        border-color: orange;
        color: orange;
      }
      #savePath{
        flex: 1;
        margin: 0 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        color: rgba(238,238,238,0.7);
        cursor: pointer;
      }
      #savePath:hover{
        color: orange;
      }
      #bodyBlur {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        filter: blur(15px);
        display: none;
      }
    </style>
   <link rel="stylesheet" href="static/css/font-awesome.css">
   <script>window.$ = window.jQuery = require('./jquery.min.js');</script>
  </head>
  <body>
    <div class="header">
      <span class="header-btn" id="closeBtn" title="关闭/最小化">
        <i class="fa fa-times" aria-hidden="true"></i>
      </span>
      <span class="header-btn" id="settingBtn" title="设置">
        <i class="fa fa-cog" aria-hidden="true"></i>
      </span>
      <span class="header-btn" id="infoBtn">
        <i class="fa fa-info" aria-hidden="true"></i>
      </span>
      <span class="title">Bing Wallpaper</span>
    </div>
    <div id="body">
      <div class="tips">无网络！</div>
      <div class="loading"><i class="fa fa-circle-o-notch fa-spin" aria-hidden="true"></i></div>
      <div id="img">
        <div id="imgMain"></div>
        <div class="leftBtn imgBtn"><i class="fa fa-chevron-left" aria-hidden="true" title="上一天壁纸"></i></div>
        <div class="rightBtn imgBtn"><i class="fa fa-chevron-right" aria-hidden="true" title="下一天壁纸"></i></div>
        <div class="toolBar">
            <div><i class="fa fa-folder-o openFolder" aria-hidden="true" title="打开壁纸保存文件夹"></i></div>
            <div><i class="fa fa-desktop set" aria-hidden="true" title="设为壁纸，会自动保存"></i></div>
            <div><i class="fa fa-download down" aria-hidden="true" title="下载"></i></div>
        </div>
        <div id="imgDate" title="图片日期"></div>
        <div id="copyright" title="版权信息"></div>
      </div>
    </div>
    <div id="bodyBlur"></div>
    <div id="setting">
      <div class="setting-card">
        <div class="setting-title">设置</div>
        <div class="setting-row">
          <span class="setting-label">开机自启</span>
          <label class="switch">
            <input type="checkbox" class="check autoOpen" name="autoOpen">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">每日自动设置壁纸</span>
          <label class="switch">
            <input type="checkbox" class="check autoSet" name="autoSet">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">每日自动下载壁纸</span>
          <label class="switch">
            <input type="checkbox" class="check autoDownDay" name="autoDownDay">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">浏览时自动下载</span>
          <label class="switch">
            <input type="checkbox" class="check autoDown" name="autoDown">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">点击关闭时最小化窗口到托盘</span>
          <label class="switch">
            <input type="checkbox" class="check min" name="min">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">壁纸保存路径</span>
          <span id="savePath" title="打开壁纸保存文件夹"></span>
          <button type="button" class="choseFilePath">选择文件夹</button>
        </div>
      </div>
    </div>
    <script>
      // You can also require other files to run in this process
      require('./renderer.js')
    </script>
  </body>
</html>
